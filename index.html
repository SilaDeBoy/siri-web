<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Siri</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Status bar mimic -->
    <div class="status-bar">
      <span class="time" id="statusTime">9:41</span>
      <div class="status-icons">
        <span class="signal"></span>
        <span class="wifi"></span>
        <span class="battery"></span>
      </div>
    </div>

    <!-- Main Siri stage -->
    <main class="stage">
      <p class="greeting" id="greeting">How can I help you?</p>

      <!-- Orb -->
      <div class="orb-wrap" id="orbWrap">
        <div class="orb-glow"></div>
        <div class="orb" id="orb">
          <div class="orb-core"></div>
          <div class="orb-ring ring-1"></div>
          <div class="orb-ring ring-2"></div>
          <div class="orb-ring ring-3"></div>
        </div>
      </div>

      <!-- Waveform while listening -->
      <div class="waveform" id="waveform" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>

      <p class="transcript" id="transcript"></p>
      <p class="response" id="response"></p>
    </main>

    <!-- Bottom controls -->
    <footer class="controls">
      <button type="button" class="mic-btn" id="micBtn" aria-label="Talk to Siri">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
          <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
      </button>
      <p class="hint" id="hint">Tap the mic or say “Hey Siri”</p>
    </footer>

    <!-- Suggestions -->
    <div class="suggestions" id="suggestions">
      <button type="button" data-cmd="Open YouTube">Open YouTube</button>
      <button type="button" data-cmd="Search YouTube for music">Search YouTube</button>
      <button type="button" data-cmd="Open Instagram">Open Instagram</button>
      <button type="button" data-cmd="Open WhatsApp">Open WhatsApp</button>
      <button type="button" data-cmd="What time is it?">What time is it?</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
